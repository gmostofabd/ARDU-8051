<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARDU-8051 | Virtual Experiment Dashboard</title>
<style>
:root {
  --primary: #1e40af; --accent: #0ea5e9; --bg: #f5f7fb;
  --card: #ffffff; --text: #1f2937; --muted: #4b5563; --hover: #1e3a8a; --btn-hover: #0b2540;
}
[data-theme="dark"] {
  --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; --muted: #94a3b8;
  --hover: #3b82f6; --btn-hover: #2563eb; --primary: #60a5fa; --accent: #38bdf8;
}
*{box-sizing:border-box;margin:0;padding:0;transition:all .25s ease;}
body{font-family:"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);}
header{
  background:linear-gradient(135deg,var(--primary),var(--accent));
  color:white;padding:3rem 1rem;text-align:center;position:relative;border-bottom:3px solid var(--accent);
}
header h1{margin:0;font-size:2.6rem;}
header p{margin:.6rem auto;max-width:850px;opacity:.95;font-size:1.05rem;}
#themeToggle{position:absolute;top:1.5rem;right:1.5rem;background:rgba(255,255,255,.85);border:none;padding:.6rem 1rem;border-radius:8px;cursor:pointer;font-weight:600;color:#1e3a8a;}
#themeToggle:hover{background:rgba(255,255,255,1);transform:scale(1.05);}
section{max-width:1200px;margin:auto;padding:3rem 1.5rem;}
section h2{text-align:center;margin-bottom:1.5rem;color:var(--primary);font-size:2rem;}
#searchResetContainer{display:flex;justify-content:center;align-items:center;gap:.8rem;margin-bottom:1.5rem;flex-wrap:wrap;}
#searchResetContainer input#searchBar{flex:1 1 250px;max-width:400px;padding:.6rem 1rem;border-radius:8px;border:1px solid #cbd5e1;font-size:1rem;background:var(--card);color:var(--text);}
[data-theme="dark"] #searchBar{border-color:#475569;background:#1e293b;color:#f1f5f9;}
#searchResetContainer button#resetBtn{padding:.5rem 1rem;border:none;border-radius:6px;background:#f43f5e;color:white;font-weight:600;cursor:pointer;flex-shrink:0;}
#searchResetContainer button#resetBtn:hover{background:#be123c;transform:scale(1.05);}
#filterButtons{text-align:center;margin-bottom:1rem;}
#filterButtons button{margin:.3rem .3rem;padding:.5rem 1rem;border:none;border-radius:6px;background:var(--primary);color:white;font-weight:500;cursor:pointer;transition:transform .2s,background .25s;}
#filterButtons button:hover{background:var(--btn-hover);transform:scale(1.05);}
#filterButtons button.active{background:var(--accent);}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:2rem;}
.card{background:var(--card);border-radius:16px;box-shadow:0 12px 28px rgba(0,0,0,.12);padding:1.6rem;display:grid;grid-template-columns:1fr 120px;gap:1.4rem;min-height:200px;cursor:pointer;transition:transform .3s ease,box-shadow .3s ease,background .3s,color .3s;}
.card:hover{transform:translateY(-6px);box-shadow:0 20px 40px rgba(0,0,0,.2);}
.card-content{display:flex;flex-direction:column;}
.card h3{margin:.3rem 0 .5rem;color:var(--primary);font-size:1.25rem;}
.card p{font-size:.95rem;line-height:1.5;color:var(--muted);flex-grow:1;}
.card a{margin-top:1rem;text-decoration:none;color:white;background:linear-gradient(120deg,var(--primary),var(--accent));padding:.55rem 1rem;border-radius:8px;font-size:.92rem;width:fit-content;font-weight:500;}
.card a:hover{background:var(--btn-hover);transform:scale(1.05);}
.media{display:flex;flex-direction:column;gap:.6rem;}
.media img{width:100%;height:70px;object-fit:cover;border-radius:8px;border:1px solid #e5e7eb;cursor:pointer;transition:transform .25s ease,filter .25s ease,border .25s ease;}
[data-theme="dark"] .media img{border-color:#334155;}
.media img:hover{transform:scale(1.05);filter:brightness(1.05);}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;z-index:999;}
.modal img{max-width:90%;max-height:90%;border-radius:10px;box-shadow:0 20px 40px rgba(0,0,0,.5);}
.modal.active{display:flex;}
@media (max-width:500px){.card{grid-template-columns:1fr;}.media img{height:60px;}}
</style>
</head>
<body data-theme="light">

<header>
  <h1>ARDU-8051 Virtual Laboratory</h1>
  <p>Interactive, simulation-based 8051 microcontroller experiments mapped directly to the ARDU-8051 hardware platform.</p>
  <button id="themeToggle">🌙 Dark Mode</button>
</header>

<section id="experiments">
<h2>🧪 Experiment Dashboard</h2>

<div id="searchResetContainer">
  <input type="text" id="searchBar" placeholder="Search by experiment name or type...">
  <button id="resetBtn">Reset Filters</button>
</div>

<div id="filterButtons">
  <button data-filter="all" class="active">All</button>
  <button data-filter="Timer">Timer</button>
  <button data-filter="Display">Display</button>
  <button data-filter="Multiplexing">Multiplexing</button>
  <button data-filter="Input">Input</button>
  <button data-filter="Matrix">Matrix</button>
  <button data-filter="Analog">Analog</button>
  <button data-filter="Motor">Motor</button>
  <button data-filter="Pulse">Pulse</button>
  <button data-filter="PWM">PWM</button>
  <button data-filter="UART">UART</button>
</div>

<div class="grid" id="experimentGrid">
  <!-- Cards dynamically inserted here via JS if needed -->
</div>
</section>

<div class="modal" id="modal">
  <img id="modalImg">
</div>

<script>
// Theme toggle
const themeBtn = document.getElementById('themeToggle');
themeBtn.addEventListener('click', ()=>{
  const body = document.body;
  if(body.dataset.theme === "light"){
    body.dataset.theme = "dark"; themeBtn.textContent = "☀️ Light Mode";
  }else{body.dataset.theme = "light"; themeBtn.textContent = "🌙 Dark Mode";}
});

// Image modal
function preview(img){
  const modal = document.getElementById('modal');
  document.getElementById('modalImg').src = img.src;
  modal.classList.add('active');
}
document.getElementById('modal').addEventListener('click', e=>{
  if(e.target.id==='modal') e.currentTarget.classList.remove('active');
});
document.addEventListener('keydown', e=>{
  if(e.key==='Escape') document.getElementById('modal').classList.remove('active');
});

// Search/filter functionality
const searchBar = document.getElementById('searchBar');
const experimentGrid = document.getElementById('experimentGrid');
function filterCards(){
  const query = searchBar.value.toLowerCase();
  const activeFilter = document.querySelector('#filterButtons button.active').dataset.filter.toLowerCase();
  Array.from(experimentGrid.children).forEach(card=>{
    const title = card.querySelector('h3').textContent.toLowerCase();
    const type = card.dataset.type.toLowerCase();
    const matchesSearch = title.includes(query) || type.includes(query);
    const matchesFilter = activeFilter === 'all' || type === activeFilter;
    card.style.display = (matchesSearch && matchesFilter) ? "grid" : "none";
  });
}
searchBar.addEventListener('input', filterCards);

// Category buttons filter
const filterButtons = document.querySelectorAll('#filterButtons button');
filterButtons.forEach(btn=>{
  btn.addEventListener('click', ()=>{
    filterButtons.forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    filterCards();
  });
});

// Reset button
document.getElementById('resetBtn').addEventListener('click', ()=>{
  searchBar.value = '';
  filterButtons.forEach(b=>b.classList.remove('active'));
  document.querySelector('#filterButtons button[data-filter="all"]').classList.add('active');
  filterCards();
});
</script>

</body>
</html>
